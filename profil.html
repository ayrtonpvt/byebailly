<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#D96A18"><title>Profil — ByeBailly</title><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body class="secondary-page"><header class="topbar secondary-topbar"><div class="topbar-inner"><a class="back-link" href="index.html" aria-label="Retour au jeu">←</a><h1>ByeBailly</h1><div class="secondary-nav"><a href="classement.html">Classement</a></div></div></header>
<main class="profile-page"><section class="profile-identity card"><div><h2 id="profileName">Profil local</h2><p id="profileMeta">Statistiques enregistrées sur cet appareil.</p></div><button class="btn-secondary" id="logoutBtn" hidden>Se déconnecter</button></section>
<p id="profileNotice" class="profile-notice" aria-live="polite"></p><p id="localAccountHint" class="profile-hint">Vous pouvez utiliser toutes les statistiques sans compte. Un compte sert uniquement à les synchroniser et à apparaître au classement.</p>
<section class="auth-panel card" id="authPanel"><div class="auth-column"><h3>Se connecter</h3><form id="loginForm"><label>Pseudo<input id="loginUsername" autocomplete="username" required></label><label>Mot de passe<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="btn-primary" type="submit">Se connecter</button></form></div><div class="auth-column"><h3>Créer un compte</h3><form id="registerForm"><label>Pseudo<input id="registerUsername" autocomplete="username" required></label><label>Mot de passe<input id="registerPassword" type="password" autocomplete="new-password" required></label><button class="btn-primary" type="submit">Créer un compte</button></form></div></section>
<section id="authActions" hidden></section><section class="profile-stats"><div class="segmented-control stats-view-control" id="statsViewControl"><button type="button" data-view="global" class="active" aria-pressed="true">Global</button><button type="button" data-view="declinaison">Déclinaison</button><button type="button" data-view="conjugaison">Conjugaison</button><button type="button" data-view="version">Version</button></div><div class="stats-panel" id="statsContent" aria-live="polite"></div><p class="stats-updated-at" id="statsUpdatedAt"></p></section></main>
<script src="config.js"></script><script src="app-api.js"></script><script>window.StatsStore={_deviceId:localStorage.getItem('byebailly_device_id')||'',obtenir(){try{return JSON.parse(localStorage.getItem('byebailly_stats'))||{};}catch{return{};}},sauvegarder(s){localStorage.setItem('byebailly_stats',JSON.stringify(s));}};</script><script src="profile.js"></script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
