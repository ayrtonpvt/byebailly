<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">

  <defs>

    <!-- Dégradé d'arrière-plan -->

    <linearGradient id="_SquareLinearLight" x1="0" y1="0" x2="0" y2="1">

      <stop offset="0%" stop-color="#EFEDE5" />

      <stop offset="100%" stop-color="#DDD9CB" />

    </linearGradient>



    <!-- Dégradé pour les lettres BB -->

    <linearGradient id="_BaillyLinearLight" x1="0" y1="0" x2="0" y2="1">

      <stop offset="0.15" stop-color="#CF6710" />

      <stop offset="1" stop-color="#AC4811" />

    </linearGradient>

    

    <!-- Le filtre d'ombre a été supprimé pour un rendu totalement plat -->

  </defs>



  <!-- Fond avec coins légèrement arrondis et dégradé -->

  <rect width="512" height="512" rx="160" fill="url(#_SquareLinearLight)" />



  <!-- Lettres BB vectorielles SANS ombre portée -->

  <text x="50%" y="54%" 

        dominant-baseline="middle" 

        text-anchor="middle" 

        font-family="Georgia, 'Times New Roman', serif" 

        font-weight="bold" 

        font-size="285" 

        fill="url(#_BaillyLinearLight)">BB</text>

</svg>
